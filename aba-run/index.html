<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07120d">
<title>ABA RUN | No Be Just Road. Na Aba.</title>
<style>
:root{--green:#08783f;--green2:#0d9b55;--gold:#f7b928;--cream:#f5efe3;--ink:#07120d;--red:#d73535}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07120d;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;border:0;cursor:pointer}.app{height:100%;position:relative;overflow:hidden;background:#101812}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 20%,#c7e8ef 0 9%,transparent 35%),linear-gradient(#9dd9e9 0 38%,#a7bd84 38% 100%)}
.bg:before{content:"";position:absolute;left:-10%;right:-10%;top:35%;height:17%;background:linear-gradient(180deg,#8a9a6a,#687858);transform:skewY(-4deg)}
.city{position:absolute;bottom:42%;left:0;right:0;height:20%;opacity:.8;background:linear-gradient(90deg,transparent 0 4%,#d7cbb5 4% 11%,transparent 11% 15%,#b9ad9a 15% 24%,transparent 24% 30%,#d1c5ad 30% 39%,transparent 39% 45%,#9d9b8d 45% 53%,transparent 53% 60%,#cfc0a5 60% 69%,transparent 69% 74%,#b4ab9b 74% 84%,transparent 84%)}
.road{position:absolute;left:7%;right:7%;top:36%;bottom:-6%;background:#292b2b;clip-path:polygon(17% 0,83% 0,100% 100%,0 100%);box-shadow:0 -10px 35px #0004 inset}
.road:before,.road:after{content:"";position:absolute;top:0;bottom:0;width:5px;background:#c9c4b7}.road:before{left:16%}.road:after{right:16%}
.lane{position:absolute;top:0;bottom:0;width:3px;background:repeating-linear-gradient(to bottom,#eee 0 28px,transparent 28px 57px);opacity:.8}.lane.one{left:39%}.lane.two{left:61%}
.grass{position:absolute;left:0;right:0;bottom:0;height:17%;background:repeating-linear-gradient(165deg,#799a61 0 8px,#6f8f58 8px 13px)}
.topbar{position:absolute;z-index:20;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px}.mark{width:46px;height:46px;filter:drop-shadow(0 5px 12px #0007)}.brandtext{font-weight:1000;line-height:.8;letter-spacing:-.07em;font-size:28px}.brandtext i{font-style:normal;color:var(--gold)}.tag{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#d8dfd9;margin-top:7px}
.stats{display:flex;gap:7px}.stat{min-width:76px;padding:8px 11px;border:1px solid #ffffff20;background:#07120dd9;border-radius:13px;backdrop-filter:blur(12px);box-shadow:0 8px 25px #0003}.stat small{display:block;font-size:8px;color:#92a199;letter-spacing:.14em}.stat b{font-size:15px;color:var(--gold)}
.home{position:absolute;z-index:30;inset:0;display:flex;align-items:flex-end;padding:0 18px 30px}.hero{width:min(650px,100%);margin:auto auto 0;text-align:center}.eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#fff9;margin-bottom:10px}.title{font-size:clamp(68px,19vw,142px);line-height:.78;letter-spacing:-.09em;font-weight:1000;text-transform:uppercase;text-shadow:0 8px 0 #07120d,0 18px 35px #0008;margin:0}.title span{color:var(--gold)}.subtitle{font-size:clamp(12px,3.3vw,17px);font-weight:800;letter-spacing:.04em;margin:17px 0 20px;color:#f5f1e8}.cta{width:min(420px,100%);padding:17px 20px;border-radius:16px;background:linear-gradient(180deg,#13a35c,#08783f);color:#fff;font-weight:1000;letter-spacing:.08em;box-shadow:0 10px 0 #064a28,0 18px 35px #0007;transform:translateY(-2px)}.cta:active{transform:translateY(4px);box-shadow:0 4px 0 #064a28}.secondary{margin-top:13px;color:#d8e0da;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.features{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:17px}.chip{font-size:9px;padding:7px 9px;border-radius:99px;background:#07120dbd;border:1px solid #ffffff18;color:#c9d0cb}
.hidden{display:none!important}
.hud{position:absolute;z-index:25;top:74px;left:50%;transform:translateX(-50%);width:min(92vw,620px);display:flex;justify-content:center}.mission{background:#07120de8;border:1px solid #f7b92855;border-radius:999px;padding:9px 15px;font-size:10px;font-weight:900;letter-spacing:.04em;box-shadow:0 8px 25px #0005}
.controls{position:absolute;z-index:40;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.group{display:flex;gap:9px;pointer-events:auto}.ctrl{width:58px;height:58px;border-radius:18px;background:#07120dcc;color:#fff;border:1px solid #ffffff22;box-shadow:0 9px 24px #0006;backdrop-filter:blur(10px);font-size:22px}.ctrl:active{transform:scale(.94)}.horn{border-radius:50%;font-size:18px}.gas{width:72px;height:72px;border-radius:24px;background:linear-gradient(180deg,#f7b928,#d99b0e);color:#17140a;font-size:28px}
.toast{position:absolute;z-index:50;left:50%;top:27%;transform:translate(-50%,-50%) scale(.8);background:#f7b928;color:#07120d;font-weight:1000;padding:11px 18px;border-radius:999px;opacity:0;transition:.2s;box-shadow:0 10px 30px #0007}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.end{position:absolute;z-index:60;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#07120dbd;backdrop-filter:blur(9px)}.card{width:min(450px,100%);padding:28px;border:1px solid #ffffff20;border-radius:28px;background:linear-gradient(160deg,#12251bd9,#07120df2);box-shadow:0 30px 90px #0009;text-align:center}.card .mini{font-size:9px;letter-spacing:.3em;color:#8ea096}.card h2{font-size:46px;letter-spacing:-.07em;margin:8px 0}.score{font-size:55px;font-weight:1000;color:var(--gold);letter-spacing:-.06em}.result{color:#b9c4bd;font-size:13px;line-height:1.5;margin:7px 0 22px}.footer{display:flex;justify-content:space-between;color:#748179;font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-top:15px}
@media(max-width:600px){.topbar{padding:10px}.mark{width:40px;height:40px}.brandtext{font-size:23px}.tag{font-size:7px}.stat{min-width:64px;padding:7px 8px}.stat b{font-size:12px}.home{padding-bottom:22px}.hero{margin-bottom:0}.subtitle{margin:13px 0 16px}.features{margin-top:13px}.road{left:0;right:0;clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}.lane.one{left:39%}.lane.two{left:61%}}
</style>
</head>
<body>
<div class="app">
<div class="bg"></div><div class="city"></div><div class="road"><div class="lane one"></div><div class="lane two"></div></div><div class="grass"></div>
<div class="topbar">
<div class="brand">
<svg class="mark" viewBox="0 0 100 100" aria-label="ABA RUN logo"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#12a85d"/><stop offset="1" stop-color="#075d32"/></linearGradient></defs><path d="M50 4 91 19v30c0 25-17 40-41 47C26 89 9 74 9 49V19L50 4Z" fill="#07120d" stroke="#f7b928" stroke-width="3"/><path d="M26 63 42 23h15l17 40H60l-4-11H42l-4 11H26Zm20-21h7l-3.5-10L46 42Z" fill="url(#g)"/><path d="M57 25h9c10 0 14 5 14 11 0 4-2 7-5 9 4 2 6 5 6 9 0 7-5 11-15 11H57V25Zm11 15c3 0 4-1 4-3s-2-3-5-3h-1v6h2Zm0 14c4 0 6-1 6-4s-2-4-6-4h-3v8h3Z" fill="#f7b928"/></svg>
<div><div class="brandtext">ABA <i>RUN</i></div><div class="tag">An Igbo city. One road. Endless runs.</div></div>
</div>
<div class="stats"><div class="stat"><small>FARE</small><b>₦<span id="cash">0</span></b></div><div class="stat"><small>SCORE</small><b id="score">0</b></div></div>
</div>
<div id="home" class="home"><div class="hero">
<div class="eyebrow">Welcome to Aba, Abia State</div><h1 class="title">ABA <span>RUN</span></h1>
<div class="subtitle">NO BE JUST ROAD. NA ABA.</div>
<button id="play" class="cta">START YOUR RUN&nbsp; →</button>
<div class="secondary">🚕 Keke • 🗣 Igbo • 🛣 Aba streets</div>
<div class="features"><span class="chip">ARIARIA</span><span class="chip">NGWA ROAD</span><span class="chip">MAIN PARK</span><span class="chip">FAULKS ROAD</span><span class="chip">OSISIOMA</span></div>
</div></div>
<div id="hud" class="hud hidden"><div id="mission" class="mission">MISSION • PICK UP A PASSENGER</div></div>
<div id="toast" class="toast">Nna! Correct!</div>
<div id="controls" class="controls hidden"><div class="group"><button class="ctrl" id="left">‹</button><button class="ctrl" id="right">›</button></div><div class="group"><button class="ctrl horn" id="horn">◉</button><button class="ctrl gas" id="gas">↑</button></div></div>
<div id="end" class="end hidden"><div class="card"><div class="mini">RUN COMPLETE</div><h2>ABA <span style="color:#f7b928">RUN</span></h2><div class="score" id="finalScore">0</div><div class="result" id="result"></div><button id="again" class="cta">RUN AM AGAIN&nbsp; →</button><div class="footer"><span>BEST <b id="best">0</b></span><span>ABA DRIVER</span></div></div></div>
</div>
<script>
const c=document.createElement('canvas');document.querySelector('.app').appendChild(c);const x=c.getContext('2d');let W,H,dpr,playing=false,last=0,score=0,cash=0,dist=0,passengers=0,off=0,lane=1,target=1,speed=7,spawn=0,objs=[],passenger=null;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const names=[['Chinedu','Oga, biko kwụsị ebe a.'],['Amarachi','Oga abeg, mee ngwa ngwa!'],['Emeka','Ego ole?'],['Ada','Nna, jiri nwayọọ.'],['Ifeanyi','Biko, take this side.'],['Mama Ngozi','Chai! O karịrị akarị o!'],['Kelechi','Ebee ka anyị na-aga?']];
function road(){return{l:W*.12,r:W*.88,w:W*.76}}function lx(i){let r=road();return r.l+r.w*(i+.5)/3}function ui(){document.getElementById('cash').textContent=Math.floor(cash).toLocaleString();document.getElementById('score').textContent=Math.floor(score).toLocaleString();document.getElementById('mission').textContent=passenger?'PASSENGER • '+passenger[0]+' • '+passenger[1]:(passengers<4?'MISSION • PICK UP A PASSENGER':'MISSION • REACH OSISIOMA')}
function say(t){let q=document.getElementById('toast');q.textContent=t;q.classList.add('show');setTimeout(()=>q.classList.remove('show'),900)}
function spawn(){objs.push({lane:Math.floor(Math.random()*3),y:-80,type:Math.random()<.22?'p':'car',spd:1+Math.random()*2,col:['#d73535','#f7b928','#08783f','#202525'][Math.floor(Math.random()*4)]})}
function start(){score=0;cash=0;dist=0;passengers=0;off=0;lane=1;target=1;speed=7;spawn=0;objs=[];passenger=null;playing=true;document.getElementById('home').classList.add('hidden');document.getElementById('end').classList.add('hidden');document.getElementById('controls').classList.remove('hidden');document.getElementById('hud').classList.remove('hidden');ui();requestAnimationFrame(loop)}
function finish(){playing=false;document.getElementById('controls').classList.add('hidden');document.getElementById('hud').classList.add('hidden');document.getElementById('end').classList.remove('hidden');document.getElementById('finalScore').textContent=Math.floor(score).toLocaleString();document.getElementById('result').textContent='You carried '+passengers+' passenger'+(passengers===1?'':'s')+' and made ₦'+Math.floor(cash).toLocaleString()+'. Best driver score saved on this device.';let b=Math.max(Number(localStorage.abaBest||0),Math.floor(score));localStorage.abaBest=b;document.getElementById('best').textContent=b.toLocaleString()}
function drawWorld(){x.clearRect(0,0,W,H);let r=road();x.fillStyle='#789b61';x.fillRect(0,0,W,H);x.fillStyle='#292b2b';x.beginPath();x.moveTo(r.l,H*.36);x.lineTo(r.r,H*.36);x.lineTo(W,H);x.lineTo(0,H);x.closePath();x.fill();x.strokeStyle='#d5d0c5';x.lineWidth=4;x.beginPath();x.moveTo(r.l,H*.36);x.lineTo(0,H);x.moveTo(r.r,H*.36);x.lineTo(W,H);x.stroke();x.strokeStyle='#eee';x.lineWidth=3;x.setLineDash([26,24]);x.lineDashOffset=-off;x.beginPath();for(let i=1;i<3;i++){let a=r.l+r.w*i/3;x.moveTo(a,H*.36);x.lineTo(W*(i/3),H)}x.stroke();x.setLineDash([])}
function drawPlayer(){let px=lx(lane),py=H*.75;x.save();x.translate(px,py);x.shadowColor='#0009';x.shadowBlur=15;x.fillStyle='#08783f';x.beginPath();x.roundRect(-27,-48,54,94,13);x.fill();x.shadowBlur=0;x.fillStyle='#a9d8e5';x.fillRect(-18,-30,36,22);x.fillStyle='#f7b928';x.fillRect(-21,10,42,12);x.fillStyle='#111';[-21,11].forEach(a=>{x.fillRect(a,-43,10,8);x.fillRect(a,34,10,8)});x.fillStyle='#fff';x.font='900 9px system-ui';x.textAlign='center';x.fillText('ABA',0,2);x.restore()}
function drawObj(o){let px=lx(o.lane),py=o.y;x.save();x.translate(px,py);if(o.type==='p'){x.fillStyle='#f7b928';x.beginPath();x.arc(0,0,17,0,Math.PI*2);x.fill();x.fillStyle='#07120d';x.font='900 10px system-ui';x.textAlign='center';x.fillText('P',0,4)}else{x.fillStyle=o.col;x.beginPath();x.roundRect(-24,-38,48,76,10);x.fill();x.fillStyle='#a9d8e5';x.fillRect(-16,-25,32,19);x.fillStyle='#111';x.fillRect(-21,-33,10,7);x.fillRect(11,-33,10,7);x.fillRect(-21,27,10,7);x.fillRect(11,27,10,7)}x.restore()}
function loop(t){if(!playing)return;let dt=Math.min((t-last)/16.67,2);last=t;off+=speed*dt;dist+=speed*.003*dt;score+=speed*.75*dt;spawn+=dt;if(spawn>34){spawn=0;spawn()}lane+=(target-lane)*.18*dt;objs.forEach(o=>o.y+=(speed+o.spd)*dt);for(let i=objs.length-1;i>=0;i--){let o=objs[i];if(o.y>H+80){objs.splice(i,1);continue}if(o.y>H*.63&&o.y<H*.82&&Math.abs(o.lane-Math.round(lane))<.2){if(o.type==='p'){passenger=names[Math.floor(Math.random()*names.length)];passengers++;cash+=350+passengers*35;score+=800;say(passenger[1]);objs.splice(i,1)}else{score=Math.max(0,score-450);cash=Math.max(0,cash-100);say('Chai! Watch the road!')}}}drawWorld();objs.forEach(drawObj);drawPlayer();ui();if(dist>3.2){finish();return}requestAnimationFrame(loop)}
function move(n){target=Math.max(0,Math.min(2,target+n))}addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if(e.code==='Space')say('PÒÒN-PÒÒN!')});document.getElementById('left').onpointerdown=()=>move(-1);document.getElementById('right').onpointerdown=()=>move(1);document.getElementById('horn').onpointerdown=()=>say('PÒÒN-PÒÒN!');document.getElementById('gas').onpointerdown=()=>{speed=Math.min(11,speed+.6);setTimeout(()=>speed=Math.max(7,speed-.6),450)};document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;document.getElementById('best').textContent=Number(localStorage.abaBest||0).toLocaleString();
</script>
</body></html>
