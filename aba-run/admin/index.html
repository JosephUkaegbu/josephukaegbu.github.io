<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABA RUN Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--g:#08783f;--gold:#f7b928;--ink:#06110b;--muted:#91a49a}*{box-sizing:border-box}body{margin:0;background:#eef3ef;color:#122019;font:14px system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:18px 20px;border-radius:18px}.brand{font-weight:1000;font-size:24px}.brand b{color:var(--gold)}button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:#fff}.danger{background:#c62828;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px #0000000d}.num{font-size:28px;font-weight:1000}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{background:#fff}.tab.active{background:var(--g);color:#fff}.panel{background:#fff;border-radius:16px;padding:16px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e8eee9;font-size:13px}.auth{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:20px;box-shadow:0 15px 50px #0002}input{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ccd8d0;border-radius:10px}small,.muted{color:var(--muted)}#app{display:none}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}</style></head><body><div id="auth" class="auth"><h1>ABA <span style="color:#08783f">RUN</span> Admin</h1><p class="muted">Sign in to manage the live game.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="primary" id="signin">SIGN IN</button> <button id="signup">FIRST ADMIN SETUP</button><p id="msg"></p></div><div id="app"><div class="wrap"><div class="head"><div class="brand">ABA <b>RUN</b> <small>ADMIN</small></div><button id="logout">LOG OUT</button></div><div class="grid"><div class="card">Players<div class="num" id="players">—</div></div><div class="card">Runs<div class="num" id="runs">—</div></div><div class="card">Top Score<div class="num" id="top">—</div></div><div class="card">Total Fares<div class="num" id="fares">—</div></div></div><div class="tabs"><button class="tab active" data-view="leaderboard">Leaderboard</button><button class="tab" data-view="playersView">Players</button><button class="tab" data-view="content">Content</button></div><div class="panel" id="panel"></div></div></div><script>const SUPA_URL='https://uhznenjxhdosesgvylts.supabase.co';const SUPA_KEY='sb_publishable_Sn9p8Ew7YaBsige4O-aZSA_21gUZJY-';const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);const API=SUPA_URL+'/functions/v1/aba-run-api';const $=id=>document.getElementById(id);async function call(path,opt={}){let s=await sb.auth.getSession();let h=Object.assign({'content-type':'application/json'},opt.headers||{});if(s.data.session)h.authorization='Bearer '+s.data.session.access_token;let r=await fetch(API+path,{...opt,headers:h});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}function msg(t){$('msg').textContent=t}async function auth(){let s=await sb.auth.getSession();if(s.data.session){$('auth').style.display='none';$('app').style.display='block';load('leaderboard')}}$('signin').onclick=async()=>{try{let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)throw r.error;await auth()}catch(e){msg(e.message)}};$('signup').onclick=async()=>{try{let r=await sb.auth.signUp({email:$('email').value,password:$('password').value});if(r.error)throw r.error;msg('Check your email, then sign in. The first confirmed account can claim admin access.')}catch(e){msg(e.message)}};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.view)});async function load(view){try{let d=await call('/api/admin/dashboard');$('players').textContent=d.stats.players.toLocaleString();$('runs').textContent=d.stats.runs.toLocaleString();$('top').textContent=d.stats.topScore.toLocaleString();$('fares').textContent='₦'+d.stats.fares.toLocaleString();if(view==='leaderboard'){$('panel').innerHTML='<h2>Top Runs</h2><table><tr><th>Player</th><th>Score</th><th>Cash</th><th>Zone</th><th>Date</th></tr>'+d.leaderboard.map(x=>'<tr><td>'+x.player+'</td><td>'+x.score.toLocaleString()+'</td><td>₦'+x.cash.toLocaleString()+'</td><td>'+x.zone+'</td><td>'+new Date(x.createdAt).toLocaleString()+'</td></tr>').join('')+'</table>'}else if(view==='playersView'){$('panel').innerHTML='<h2>Players</h2><table><tr><th>Name</th><th>Joined</th></tr>'+d.players.map(x=>'<tr><td>'+x.display_name+'</td><td>'+new Date(x.created_at).toLocaleString()+'</td></tr>').join('')+'</table>'}else{$('panel').innerHTML='<h2>Game Content</h2><p>Radio stations: <b>'+d.content.radio+'</b> · Billboards: <b>'+d.content.billboards+'</b> · Missions: <b>'+d.content.missions+'</b></p><p class="muted">Content editing endpoints are next; the dashboard is already connected to the live backend.</p>'}}catch(e){$('panel').innerHTML='<b>Admin access required.</b><p>'+e.message+'</p>'}}auth();</script></body></html>
