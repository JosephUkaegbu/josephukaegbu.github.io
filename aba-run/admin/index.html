<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABA RUN Admin Control Centre</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#08783f;--green2:#0b6b3a;--gold:#f4b400;--ink:#07120c;--bg:#eef3ef;--card:#fff;--muted:#6c7d73;--line:#dfe9e2;--red:#c62828;--blue:#1565c0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#142019;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#fff}.gold{background:var(--gold);color:#17120a}.danger{background:var(--red);color:#fff}.ghost{background:#edf3ef;color:#1a2b22}.hidden{display:none!important}
.auth{max-width:460px;margin:7vh auto;padding:30px;background:#fff;border-radius:22px;box-shadow:0 20px 70px #0002}.logo{font-size:28px;font-weight:1000;letter-spacing:-1px}.logo b{color:var(--gold)}.tag{color:var(--muted);margin:5px 0 25px}
label{display:block;font-weight:800;font-size:12px;margin:12px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #cddbd2;border-radius:10px;background:#fff;font:inherit}textarea{min-height:90px}.pass{position:relative}.pass input{padding-right:46px}.eye{position:absolute;right:5px;top:5px;padding:8px;background:transparent;font-size:18px}.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.msg{min-height:22px;margin-top:14px;font-weight:700}.msg.ok{color:var(--green)}.msg.err{color:var(--red)}.small{font-size:12px;color:var(--muted)}
.shell{max-width:1450px;margin:auto;padding:16px}.top{background:var(--ink);color:#fff;border-radius:17px;padding:14px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px}.top-right{display:flex;align-items:center;gap:8px}.admin-email{font-size:12px;color:#c9d6ce}.status{display:inline-flex;align-items:center;gap:6px;background:#163021;padding:7px 9px;border-radius:999px;font-size:11px;font-weight:900}.dot{width:8px;height:8px;border-radius:50%;background:#5ee38a}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:12px 0}.card{background:var(--card);border-radius:15px;padding:15px;box-shadow:0 4px 22px #0000000b}.label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.num{font-size:25px;font-weight:1000;margin-top:4px}.layout{display:grid;grid-template-columns:210px 1fr;gap:12px}.side{background:#fff;border-radius:15px;padding:10px;height:max-content;box-shadow:0 4px 22px #0000000b}.tab{display:block;width:100%;text-align:left;background:transparent;margin:3px 0}.tab.active{background:var(--green);color:#fff}.content{background:#fff;border-radius:15px;padding:17px;min-height:550px;box-shadow:0 4px 22px #0000000b}.toolbar{display:flex;gap:7px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.toolbar .left,.toolbar .right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.search{max-width:280px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#f7faf8}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:4px 7px;border-radius:99px;background:#e8f3eb;font-size:11px;font-weight:900}.item{border:1px solid var(--line);border-radius:12px;padding:13px;margin:8px 0}.itemhead{display:flex;justify-content:space-between;gap:8px;align-items:center}.modal{position:fixed;inset:0;background:#07120c99;z-index:20;padding:5vh 4%;overflow:auto}.modalbox{max-width:760px;margin:auto;background:#fff;border-radius:18px;padding:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:35px;text-align:center;color:var(--muted)}.notice{background:#fff8dc;border:1px solid #f0d57a;padding:12px;border-radius:11px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{padding:18px;text-align:left}.section-title{margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin:0 0 15px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.tab{width:auto;white-space:nowrap}.quick{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.auth{margin:3vh 14px}.cards{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.top-right{flex-direction:column;align-items:flex-end}.row{grid-template-columns:1fr}.quick{grid-template-columns:1fr}}
</style></head>
<body>
<section id="auth" class="auth">
  <div class="logo">ABA <b>RUN</b></div><div class="tag">Administrator Control Centre</div>
  <div class="notice"><b>Secure access.</b><br><span class="small">Create the first administrator once. After that, use normal sign-in.</span></div>
  <label>Email address</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com">
  <label>Password</label><div class="pass"><input id="password" type="password" autocomplete="current-password" placeholder="Minimum 8 characters"><button class="eye" id="eye" type="button" aria-label="Show password">◉</button></div>
  <div class="auth-actions"><button class="primary" id="signin">SIGN IN</button><button class="gold" id="setup">FIRST ADMIN SETUP</button></div>
  <button class="ghost" id="forgot" style="width:100%;margin-top:8px">FORGOT PASSWORD</button>
  <div id="msg" class="msg"></div>
</section>

<section id="app" class="shell hidden">
  <header class="top"><div><div class="logo">ABA <b>RUN</b> <span style="font-size:13px;color:#fff">ADMIN</span></div><div class="admin-email" id="adminEmail"></div></div>
    <div class="top-right"><span class="status"><i class="dot"></i><span id="healthText">Checking system</span></span><button class="ghost" id="refresh">REFRESH</button><button class="danger" id="logout">LOG OUT</button></div>
  </header>
  <div class="cards">
    <div class="card"><div class="label">Players</div><div class="num" id="players">0</div></div>
    <div class="card"><div class="label">Runs</div><div class="num" id="runs">0</div></div>
    <div class="card"><div class="label">Top Score</div><div class="num" id="top">0</div></div>
    <div class="card"><div class="label">Total Fares</div><div class="num" id="fares">₦0</div></div>
    <div class="card"><div class="label">Radio</div><div class="num" id="radioCount">0</div></div>
    <div class="card"><div class="label">Missions</div><div class="num" id="missionCount">0</div></div>
  </div>
  <div class="layout">
    <nav class="side" id="tabs">
      <button class="tab active" data-v="overview">▣ Overview</button>
      <button class="tab" data-v="leaderboard">🏆 Leaderboard</button>
      <button class="tab" data-v="players">👥 Players</button>
      <button class="tab" data-v="radio">📻 Radio Stations</button>
      <button class="tab" data-v="billboards">🪧 Billboards</button>
      <button class="tab" data-v="missions">🎯 Missions</button>
      <button class="tab" data-v="achievements">🏅 Achievements</button>
      <button class="tab" data-v="daily">📅 Daily Missions</button>
      <button class="tab" data-v="config">⚙ Game Config</button>
      <button class="tab" data-v="audit">🛡 Audit Log</button>
    </nav>
    <main class="content" id="panel"></main>
  </div>
</section>
<div id="modal" class="modal hidden"></div>

<script>
const URL="https://uhznenjxhdosesgvylts.supabase.co",KEY="sb_publishable_Sn9p8Ew7YaBsige4O-aZSA_21gUZJY-",API=URL+"/functions/v1/aba-run-api";
const sb=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let dash=null,current="overview";
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function message(t,ok=false){$("msg").textContent=t;$("msg").className="msg "+(ok?"ok":"err")}
function busy(id,on,text){let b=$(id);b.disabled=on;if(on){b.dataset.old=b.textContent;b.textContent=text||"PLEASE WAIT..."}else b.textContent=b.dataset.old||b.textContent}
async function call(path,opt={}){
  const s=await sb.auth.getSession(),h={"content-type":"application/json",...(opt.headers||{})};
  if(s.data.session)h.authorization="Bearer "+s.data.session.access_token;
  const r=await fetch(API+path,{...opt,headers:h}),j=await r.json().catch(()=>({error:"Invalid server response"}));
  if(!r.ok)throw Error(j.error||("Request failed ("+r.status+")"));return j;
}
async function health(){try{const r=await fetch(API+"/health");const j=await r.json();$("healthText").textContent=j.ok?"SYSTEM ONLINE":"DATABASE ISSUE"}catch(e){$("healthText").textContent="OFFLINE"}}
async function load(v=current){
  current=v;try{
    dash=await call("/api/admin/dashboard");
    $("players").textContent=(dash.stats.players||0).toLocaleString();$("runs").textContent=(dash.stats.runs||0).toLocaleString();$("top").textContent=(dash.stats.topScore||0).toLocaleString();$("fares").textContent="₦"+(dash.stats.fares||0).toLocaleString();
    $("radioCount").textContent=(dash.content?.radio||0).toLocaleString();$("missionCount").textContent=(dash.content?.missions||0).toLocaleString();
    render(v);
  }catch(e){
    if(String(e.message).includes("Admin access")){await sb.auth.signOut();$("app").classList.add("hidden");$("auth").classList.remove("hidden");message("Your account is not authorized as an ABA RUN administrator.");return}
    $("panel").innerHTML='<div class="notice"><b>Dashboard error</b><p>'+esc(e.message)+'</p><button class="primary" onclick="load(current)">TRY AGAIN</button></div>';
  }
}
function render(v){
  let p=$("panel");
  if(v==="overview")return p.innerHTML='<h2 class="section-title">Dashboard Overview</h2><p class="sub">Live control centre for ABA RUN.</p><div class="quick"><button class="ghost" onclick="load("leaderboard")"><b>🏆 Review leaderboard</b><br><span class="small">Inspect top runs and fares.</span></button><button class="ghost" onclick="load("players")"><b>👥 Manage players</b><br><span class="small">Edit progression and balances.</span></button><button class="ghost" onclick="load("radio")"><b>📻 Manage radio</b><br><span class="small">Stations, streams and websites.</span></button></div><br><div class="notice"><b>System health:</b> API and database status is shown above. Use the Audit Log to trace administrator changes.</div>';
  if(v==="leaderboard")return p.innerHTML='<div class="toolbar"><div><h2 class="section-title">Leaderboard</h2><p class="sub">Highest scoring runs.</p></div><button class="ghost" onclick="load("leaderboard")">REFRESH</button></div><div class="tablewrap"><table><tr><th>Player</th><th>Score</th><th>Fare</th><th>Zone</th><th>Vehicle</th><th>Passengers</th><th>Near misses</th><th>Health</th></tr>'+dash.leaderboard.map(x=>'<tr><td>'+esc(x.player)+'</td><td>'+Number(x.score||0).toLocaleString()+'</td><td>₦'+Number(x.cash||0).toLocaleString()+'</td><td>'+esc(x.zone)+'</td><td>'+esc(x.vehicle)+'</td><td>'+x.passengers+'</td><td>'+x.nearMisses+'</td><td>'+x.health+'%</td></tr>').join("")+'</table></div>';
  if(v==="players")return playersView();
  if(["radio","billboards","missions","achievements","daily","config"].includes(v))return content(v);
  if(v==="audit")return p.innerHTML='<div class="toolbar"><div><h2 class="section-title">Audit Log</h2><p class="sub">Recent administrator actions.</p></div><button class="ghost" onclick="load("audit")">REFRESH</button></div><div class="tablewrap"><table><tr><th>Time</th><th>Action</th><th>Entity</th><th>Details</th></tr>'+dash.audits.map(x=>'<tr><td>'+new Date(x.created_at).toLocaleString()+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.entity)+'</td><td><small>'+esc(JSON.stringify(x.details||{}))+'</small></td></tr>').join("")+'</table></div>';
}
function playersView(){
 const q=$("playerSearch")?.value?.toLowerCase()||"",rows=(dash.players||[]).filter(x=>[x.display_name,x.paint,x.horn].join(" ").toLowerCase().includes(q));
 $("panel").innerHTML='<div class="toolbar"><div><h2 class="section-title">Players</h2><p class="sub">Manage player progression and economy.</p></div><div class="right"><input class="search" id="playerSearch" placeholder="Search players" value="'+esc(q)+'"><button class="ghost" onclick="load("players")">REFRESH</button></div></div><div class="tablewrap"><table><tr><th>Name</th><th>Level</th><th>Bank</th><th>Engine</th><th>Tyres</th><th>Brakes</th><th>Body</th><th>Paint</th><th>Horn</th><th></th></tr>'+rows.map(x=>'<tr><td>'+esc(x.display_name)+'</td><td>'+x.level+'</td><td>₦'+Number(x.bank||0).toLocaleString()+'</td><td>'+x.engine+'</td><td>'+x.tyres+'</td><td>'+x.brakes+'</td><td>'+x.body+'</td><td>'+esc(x.paint)+'</td><td>'+esc(x.horn)+'</td><td><button onclick="editPlayer(\''+x.id+'\')">EDIT</button></td></tr>').join("")+'</table></div>';
 $("playerSearch").oninput=playersView;
}
async function content(type){
 try{const endpoint=type==="daily"?"daily-missions":type,data=await call("/api/admin/"+endpoint);let title={radio:"Radio Stations",billboards:"Billboards",missions:"Missions",achievements:"Achievements",daily:"Daily Missions",config:"Game Config"}[type];
 $("panel").innerHTML='<div class="toolbar"><div><h2 class="section-title">'+title+'</h2><p class="sub">Create, edit, enable or disable live game content.</p></div><div class="right"><button class="primary" onclick="newItem(\''+type+'\')">+ ADD</button><button class="ghost" onclick="load(\''+type+'\')">REFRESH</button></div></div><div id="items"></div>';
 $("items").innerHTML=data.map(x=>itemCard(type,x)).join("")||'<div class="empty">No records yet.</div>';
 }catch(e){$("panel").innerHTML='<div class="notice">'+esc(e.message)+'</div>'}
}
function itemCard(t,x){
 if(t==="radio")return '<div class="item"><div class="itemhead"><b>'+esc(x.name)+'</b><span class="pill">'+esc(x.frequency)+'</span></div><p>'+esc(x.city)+' · '+(x.enabled?"Enabled":"Disabled")+'<br><small>'+esc(x.stream_url||"No direct stream URL")+'</small></p><div class="actions"><button onclick="editItem(\''+t+'\',\''+x.id+'\')">EDIT</button><button class="danger" onclick="delItem(\''+t+'\',\''+x.id+'\')">DELETE</button></div></div>';
 if(t==="billboards")return '<div class="item"><div class="itemhead"><b>'+esc(x.headline)+'</b><span class="pill">'+esc(x.zone)+'</span></div><p>'+esc(x.subline||"")+' · '+(x.enabled?"Enabled":"Disabled")+'</p><div class="actions"><button onclick="editItem(\''+t+'\',\''+x.id+'\')">EDIT</button><button class="danger" onclick="delItem(\''+t+'\',\''+x.id+'\')">DELETE</button></div></div>';
 if(t==="missions")return '<div class="item"><div class="itemhead"><b>'+esc(x.title)+'</b><span class="pill">'+esc(x.mission_key)+'</span></div><p>'+esc(x.description)+'<br>₦'+x.reward_cash+' · '+x.reward_score+' pts · '+(x.enabled?"Enabled":"Disabled")+'</p><div class="actions"><button onclick="editItem(\''+t+'\',\''+x.id+'\')">EDIT</button><button class="danger" onclick="delItem(\''+t+'\',\''+x.id+'\')">DELETE</button></div></div>';
 if(t==="achievements")return '<div class="item"><div class="itemhead"><b>'+esc(x.title)+'</b><span class="pill">'+esc(x.achievement_key)+'</span></div><p>'+esc(x.description)+'<br>₦'+x.reward_cash+' · '+x.reward_score+' pts · '+(x.enabled?"Enabled":"Disabled")+'</p><div class="actions"><button onclick="editItem(\''+t+'\',\''+x.id+'\')">EDIT</button><button class="danger" onclick="delItem(\''+t+'\',\''+x.id+'\')">DELETE</button></div></div>';
 if(t==="daily")return '<div class="item"><div class="itemhead"><b>'+esc(x.title)+'</b><span class="pill">'+esc(x.mission_date)+'</span></div><p>'+esc(x.mission_key)+' · target '+x.target+'<br>₦'+x.reward_cash+' · '+x.reward_score+' pts · '+(x.enabled?"Enabled":"Disabled")+'</p><div class="actions"><button onclick="editItem(\''+t+'\',\''+x.id+'\')">EDIT</button><button class="danger" onclick="delItem(\''+t+'\',\''+x.id+'\')">DELETE</button></div></div>';
 return '<div class="item"><b>'+esc(x.key)+'</b><p><small>'+esc(JSON.stringify(x.value))+'</small></p><button onclick="editItem(\'config\',\''+encodeURIComponent(x.key)+'\')">EDIT</button></div>';
}
async function editItem(t,id){const ep=t==="daily"?"daily-missions":t,d=await call("/api/admin/"+ep+"/"+id),x=Array.isArray(d)?d[0]:d;form(t,x)}
function newItem(t){form(t,{enabled:true,sort_order:0,mission_date:new Date().toISOString().slice(0,10)})}
function form(t,x){
 let fields="";
 if(t==="radio")fields='<div class="row"><label>Name<input id="f_name" value="'+esc(x.name)+'"></label><label>Frequency<input id="f_frequency" value="'+esc(x.frequency)+'"></label></div><div class="row"><label>City<input id="f_city" value="'+esc(x.city||"Aba")+'"></label><label>Sort order<input id="f_sort" type="number" value="'+(x.sort_order||0)+'"></label></div><label>Direct Stream URL<input id="f_stream" value="'+esc(x.stream_url||"")+'"></label><label>Website / Listen URL<input id="f_web" value="'+esc(x.website_url||"")+'"></label>';
 if(t==="billboards")fields='<div class="row"><label>Zone<input id="f_zone" value="'+esc(x.zone||"")+'"></label><label>Sort order<input id="f_sort" type="number" value="'+(x.sort_order||0)+'"></label></div><label>Headline<input id="f_headline" value="'+esc(x.headline||"")+'"></label><label>Subline<input id="f_subline" value="'+esc(x.subline||"")+'"></label><label>Image URL<input id="f_image" value="'+esc(x.image_url||"")+'"></label>';
 if(t==="missions")fields='<div class="row"><label>Key<input id="f_key" value="'+esc(x.mission_key||"")+'"></label><label>Sort order<input id="f_sort" type="number" value="'+(x.sort_order||0)+'"></label></div><label>Title<input id="f_title" value="'+esc(x.title||"")+'"></label><label>Description<textarea id="f_desc">'+esc(x.description||"")+'</textarea></label><div class="row"><label>Reward cash<input id="f_cash" type="number" value="'+(x.reward_cash||0)+'"></label><label>Reward score<input id="f_score" type="number" value="'+(x.reward_score||0)+'"></label></div>';
 if(t==="achievements")fields='<div class="row"><label>Key<input id="f_key" value="'+esc(x.achievement_key||"")+'"></label><label>Sort order<input id="f_sort" type="number" value="'+(x.sort_order||0)+'"></label></div><label>Title<input id="f_title" value="'+esc(x.title||"")+'"></label><label>Description<textarea id="f_desc">'+esc(x.description||"")+'</textarea></label><div class="row"><label>Reward cash<input id="f_cash" type="number" value="'+(x.reward_cash||0)+'"></label><label>Reward score<input id="f_score" type="number" value="'+(x.reward_score||0)+'"></label></div>';
 if(t==="daily")fields='<div class="row"><label>Date<input id="f_date" type="date" value="'+esc(x.mission_date||"")+'"></label><label>Key<input id="f_key" value="'+esc(x.mission_key||"")+'"></label></div><label>Title<input id="f_title" value="'+esc(x.title||"")+'"></label><label>Description<textarea id="f_desc">'+esc(x.description||"")+'</textarea></label><div class="row"><label>Target<input id="f_target" type="number" value="'+(x.target||0)+'"></label><label>Reward cash<input id="f_cash" type="number" value="'+(x.reward_cash||0)+'"></label></div><label>Reward score<input id="f_score" type="number" value="'+(x.reward_score||0)+'"></label>';
 if(t==="config")fields='<label>Key<input id="f_key" value="'+esc(x.key||"")+'"></label><label>JSON value<textarea id="f_value">'+esc(JSON.stringify(x.value||{},null,2))+'</textarea></label>';
 fields+='<label><input id="f_enabled" type="checkbox" '+(x.enabled!==false?"checked":"")+'> Enabled</label><div class="actions"><button class="primary" onclick="saveItem(\''+t+'\',\''+(x.id||"")+'\')">SAVE</button><button class="ghost" onclick="closeModal()">CANCEL</button></div>';
 $("modal").innerHTML='<div class="modalbox"><h2>'+t.toUpperCase()+'</h2>'+fields+'</div>';$("modal").classList.remove("hidden");
}
async function saveItem(t,id){
 const ep=t==="daily"?"daily-missions":t;let v={enabled:$("f_enabled")?.checked!==false};
 if(t==="radio")Object.assign(v,{name:$("f_name").value,frequency:$("f_frequency").value,city:$("f_city").value,sort_order:+$("f_sort").value,stream_url:$("f_stream").value,website_url:$("f_web").value});
 if(t==="billboards")Object.assign(v,{zone:$("f_zone").value,headline:$("f_headline").value,subline:$("f_subline").value,image_url:$("f_image").value,sort_order:+$("f_sort").value});
 if(t==="missions"||t==="achievements")Object.assign(v,{mission_key:t==="missions"?$("f_key").value:undefined,achievement_key:t==="achievements"?$("f_key").value:undefined,title:$("f_title").value,description:$("f_desc").value,reward_cash:+$("f_cash").value,reward_score:+$("f_score").value,sort_order:+$("f_sort").value});
 if(t==="daily")Object.assign(v,{mission_date:$("f_date").value,mission_key:$("f_key").value,title:$("f_title").value,description:$("f_desc").value,target:+$("f_target").value,reward_cash:+$("f_cash").value,reward_score:+$("f_score").value});
 if(t==="config"){try{v={key:$("f_key").value,value:JSON.parse($("f_value").value)}}catch(e){return alert("Invalid JSON")}}
 const path="/api/admin/"+ep+(id?"/"+id:"");await call(path,{method:id?"PATCH":"POST",body:JSON.stringify(v)});closeModal();load(t);
}
async function delItem(t,id){if(!confirm("Delete this item?"))return;const ep=t==="daily"?"daily-missions":t;await call("/api/admin/"+ep+"/"+id,{method:"DELETE"});load(t)}
function closeModal(){$("modal").classList.add("hidden")}
function editPlayer(id){const x=dash.players.find(p=>p.id===id);$("modal").innerHTML='<div class="modalbox"><h2>EDIT PLAYER</h2><div class="row"><label>Name<input id="p_name" value="'+esc(x.display_name)+'"></label><label>Bank<input id="p_bank" type="number" value="'+x.bank+'"></label><label>Level<input id="p_level" type="number" value="'+x.level+'"></label><label>Engine<input id="p_engine" type="number" value="'+x.engine+'"></label><label>Tyres<input id="p_tyres" type="number" value="'+x.tyres+'"></label><label>Brakes<input id="p_brakes" type="number" value="'+x.brakes+'"></label><label>Body<input id="p_body" type="number" value="'+x.body+'"></label><label>Paint<input id="p_paint" value="'+esc(x.paint)+'"></label><label>Horn<input id="p_horn" value="'+esc(x.horn)+'"></label></div><br><div class="actions"><button class="primary" onclick="savePlayer(\''+id+'\')">SAVE PLAYER</button><button class="ghost" onclick="closeModal()">CANCEL</button></div></div>';$("modal").classList.remove("hidden")}
async function savePlayer(id){const v={id,display_name:$("p_name").value,bank:+$("p_bank").value,level:+$("p_level").value,engine:+$("p_engine").value,tyres:+$("p_tyres").value,brakes:+$("p_brakes").value,body:+$("p_body").value,paint:$("p_paint").value,horn:$("p_horn").value};await call("/api/admin/players",{method:"PATCH",body:JSON.stringify(v)});closeModal();load("players")}
$("eye").onclick=()=>{const i=$("password"),show=i.type==="password";i.type=show?"text":"password";$("eye").textContent=show?"◉":"○";$("eye").setAttribute("aria-label",show?"Hide password":"Show password")};
$("signin").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value;if(!email||!password)return message("Enter your email and password.");busy("signin",true,"SIGNING IN...");try{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;message("Signed in.",true);await auth()}catch(e){message(e.message||"Sign in failed.")}finally{busy("signin",false)}};
$("setup").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value;if(!email||!password)return message("Enter an email and password first.");if(password.length<8)return message("Password must be at least 8 characters.");busy("setup",true,"CREATING ADMIN...");try{const j=await call("/api/admin/bootstrap",{method:"POST",body:JSON.stringify({email,password})});message(j.message||"Admin created. Signing in...",true);const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await auth()}catch(e){message(e.message||"Admin setup failed.")}finally{busy("setup",false)}};
$("forgot").onclick=async()=>{const email=$("email").value.trim();if(!email)return message("Enter your admin email first.");busy("forgot",true,"SENDING...");try{const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;message("If that account exists, a password-reset email has been requested.",true)}catch(e){message(e.message||"Could not request reset.")}finally{busy("forgot",false)}};
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};$("refresh").onclick=()=>{health();load(current)};
$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");load(b.dataset.v)};
async function auth(){const s=await sb.auth.getSession();if(!s.data.session)return;$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("adminEmail").textContent=s.data.session.user.email||"Administrator";health();load("overview")}
sb.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){ $("app").classList.add("hidden");$("auth").classList.remove("hidden") }});
auth();
</script></body></html>
