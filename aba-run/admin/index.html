<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABA RUN Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--g:#08783f;--gold:#f7b928;--ink:#06110b;--red:#c62828}*{box-sizing:border-box}body{margin:0;background:#eef3ef;color:#122019;font:14px system-ui,sans-serif}.wrap{max-width:1250px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:16px 18px;border-radius:16px}.brand{font-size:23px;font-weight:1000}.brand b{color:var(--gold)}button{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:#fff}.danger{background:var(--red);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.card,.panel,.modal{background:#fff;border-radius:15px;padding:15px;box-shadow:0 4px 20px #0000000c}.num{font-size:26px;font-weight:1000}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tab.active{background:var(--g);color:#fff}.panel{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #e6eee8;white-space:nowrap}input,textarea,select{width:100%;padding:10px;margin:4px 0 9px;border:1px solid #cbd8cf;border-radius:9px;font:inherit}textarea{min-height:70px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.actions{display:flex;gap:6px;flex-wrap:wrap}.auth{max-width:420px;margin:12vh auto;background:#fff;padding:26px;border-radius:18px;box-shadow:0 15px 50px #0002}.muted{color:#718278}.modal{position:fixed;inset:7vh 5%;overflow:auto;z-index:10}.hidden{display:none}.item{border:1px solid #e3ebe5;border-radius:12px;padding:12px;margin:8px 0}.pill{display:inline-block;padding:4px 7px;border-radius:99px;background:#e8f3eb;font-weight:800;font-size:11px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.modal{inset:2vh 2%}}</style></head><body><div id="auth" class="auth"><h1>ABA <span style="color:#08783f">RUN</span> Admin</h1><p class="muted">Live game control centre.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="primary" id="signin">SIGN IN</button> <button id="signup">FIRST ADMIN SETUP</button><p id="msg"></p></div><div id="app" style="display:none"><div class="wrap"><div class="head"><div class="brand">ABA <b>RUN</b> <small>ADMIN</small></div><button id="logout">LOG OUT</button></div><div class="grid"><div class="card">Players<div class="num" id="players">0</div></div><div class="card">Runs<div class="num" id="runs">0</div></div><div class="card">Top Score<div class="num" id="top">0</div></div><div class="card">Total Fares<div class="num" id="fares">₦0</div></div></div><div class="tabs" id="tabs"><button class="tab active" data-v="leaderboard">Leaderboard</button><button class="tab" data-v="playersView">Players</button><button class="tab" data-v="radio">Radio</button><button class="tab" data-v="billboards">Billboards</button><button class="tab" data-v="missions">Missions</button><button class="tab" data-v="config">Game Config</button><button class="tab" data-v="audit">Audit Log</button></div><div class="panel" id="panel"></div></div></div><div id="modal" class="modal hidden"></div><script>const URL='https://uhznenjxhdosesgvylts.supabase.co',KEY='sb_publishable_Sn9p8Ew7YaBsige4O-aZSA_21gUZJY-',sb=window.supabase.createClient(URL,KEY),API=URL+'/functions/v1/aba-run-api',$=x=>document.getElementById(x);let dash=null;
async function call(path,opt={}){let s=await sb.auth.getSession(),h={'content-type':'application/json',...(opt.headers||{})};if(s.data.session)h.authorization='Bearer '+s.data.session.access_token;let r=await fetch(API+path,{...opt,headers:h}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(v='leaderboard'){try{dash=await call('/api/admin/dashboard');players.textContent=dash.stats.players.toLocaleString();runs.textContent=dash.stats.runs.toLocaleString();top.textContent=dash.stats.topScore.toLocaleString();fares.textContent='₦'+dash.stats.fares.toLocaleString();let p=$('panel');if(v==='leaderboard')p.innerHTML='<h2>Top Runs</h2><table><tr><th>Player</th><th>Score</th><th>Fare</th><th>Zone</th><th>Passengers</th><th>Near misses</th><th>Health</th></tr>'+dash.leaderboard.map(x=>'<tr><td>'+esc(x.player)+'</td><td>'+x.score.toLocaleString()+'</td><td>₦'+x.cash.toLocaleString()+'</td><td>'+esc(x.zone)+'</td><td>'+x.passengers+'</td><td>'+x.nearMisses+'</td><td>'+x.health+'%</td></tr>').join('')+'</table>';else if(v==='playersView')p.innerHTML='<div class="actions"><button class="primary" onclick="playerRefresh()">REFRESH</button></div><table><tr><th>Name</th><th>Level</th><th>Bank</th><th>Engine</th><th>Tyres</th><th>Brakes</th><th>Body</th><th>Paint</th><th>Horn</th><th></th></tr>'+dash.players.map(x=>'<tr><td>'+esc(x.display_name)+'</td><td>'+x.level+'</td><td>₦'+x.bank+'</td><td>'+x.engine+'</td><td>'+x.tyres+'</td><td>'+x.brakes+'</td><td>'+x.body+'</td><td>'+esc(x.paint)+'</td><td>'+esc(x.horn)+'</td><td><button onclick="editPlayer(\''+x.id+'\')">EDIT</button></td></tr>').join('')+'</table>';else if(['radio','billboards','missions','config'].includes(v))await content(v);else p.innerHTML='<h2>Audit Log</h2><table><tr><th>Time</th><th>Action</th><th>Entity</th><th>Details</th></tr>'+dash.audits.map(x=>'<tr><td>'+new Date(x.created_at).toLocaleString()+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.entity)+'</td><td><small>'+esc(JSON.stringify(x.details||{}))+'</small></td></tr>').join('')+'</table>'}catch(e){$('panel').innerHTML='<b>'+esc(e.message)+'</b>'}}
async function content(type){let data=await call('/api/admin/'+type),p=$('panel');let title=type[0].toUpperCase()+type.slice(1);p.innerHTML='<div class="actions"><button class="primary" onclick="newItem(\''+type+'\')">+ ADD '+title.toUpperCase()+'</button><button onclick="load(\''+type+'\')">REFRESH</button></div><div id="items"></div>';let items=$('items');items.innerHTML=data.map(x=>itemCard(type,x)).join('')}
function itemCard(t,x){if(t==='radio')return '<div class="item"><b>'+esc(x.name)+'</b> <span class="pill">'+esc(x.frequency)+'</span><p>'+esc(x.city)+' · '+(x.enabled?'Enabled':'Disabled')+'<br><small>'+esc(x.stream_url||'No stream URL')+'</small></p><div class="actions"><button onclick="editItem(\''+t+'\',\''+x.id+'\')">EDIT</button><button class="danger" onclick="delItem(\''+t+'\',\''+x.id+'\')">DELETE</button></div></div>';if(t==='billboards')return '<div class="item"><b>'+esc(x.headline)+'</b> <span class="pill">'+esc(x.zone)+'</span><p>'+esc(x.subline||'')+' · '+(x.enabled?'Enabled':'Disabled')+'</p><div class="actions"><button onclick="editItem(\''+t+'\',\''+x.id+'\')">EDIT</button><button class="danger" onclick="delItem(\''+t+'\',\''+x.id+'\')">DELETE</button></div></div>';if(t==='missions')return '<div class="item"><b>'+esc(x.title)+'</b> <span class="pill">'+esc(x.mission_key)+'</span><p>'+esc(x.description)+'<br>₦'+x.reward_cash+' · '+x.reward_score+' pts · '+(x.enabled?'Enabled':'Disabled')+'</p><div class="actions"><button onclick="editItem(\''+t+'\',\''+x.id+'\')">EDIT</button><button class="danger" onclick="delItem(\''+t+'\',\''+x.id+'\')">DELETE</button></div></div>';return '<div class="item"><b>'+esc(x.key)+'</b><p><small>'+esc(JSON.stringify(x.value))+'</small></p><button onclick="editItem(\'config\',\''+encodeURIComponent(x.key)+'\')">EDIT</button></div>'}
async function editItem(t,id){let d=await call('/api/admin/'+t+'/'+id),x=Array.isArray(d)?d[0]:d;form(t,x)}
function newItem(t){form(t,{enabled:true,sort_order:0})}
function form(t,x){let fields='';if(t==='radio')fields='<div class="row"><label>Name<input id="f_name" value="'+esc(x.name)+'"></label><label>Frequency<input id="f_frequency" value="'+esc(x.frequency)+'"></label></div><div class="row"><label>City<input id="f_city" value="'+esc(x.city||'Aba')+'"></label><label>Sort order<input id="f_sort" type="number" value="'+(x.sort_order||0)+'"></label></div><label>Stream URL<input id="f_stream" value="'+esc(x.stream_url)+'"></label><label>Website URL<input id="f_web" value="'+esc(x.website_url)+'"></label>';if(t==='billboards')fields='<div class="row"><label>Zone<input id="f_zone" value="'+esc(x.zone)+'"></label><label>Sort order<input id="f_sort" type="number" value="'+(x.sort_order||0)+'"></label></div><label>Headline<input id="f_headline" value="'+esc(x.headline)+'"></label><label>Subline<input id="f_subline" value="'+esc(x.subline)+'"></label><label>Image URL<input id="f_image" value="'+esc(x.image_url)+'"></label>';if(t==='missions')fields='<div class="row"><label>Key<input id="f_key" value="'+esc(x.mission_key)+'"></label><label>Sort order<input id="f_sort" type="number" value="'+(x.sort_order||0)+'"></label></div><label>Title<input id="f_title" value="'+esc(x.title)+'"></label><label>Description<textarea id="f_desc">'+esc(x.description)+'</textarea></label><div class="row"><label>Reward cash<input id="f_cash" type="number" value="'+(x.reward_cash||0)+'"></label><label>Reward score<input id="f_score" type="number" value="'+(x.reward_score||0)+'"></label></div>';if(t==='config')fields='<label>Key<input id="f_key" value="'+esc(x.key)+'"></label><label>JSON value<textarea id="f_value">'+esc(JSON.stringify(x.value||{},null,2))+'</textarea></label>';fields+='<label><input id="f_enabled" type="checkbox" '+(x.enabled!==false?'checked':'')+'> Enabled</label><div class="actions"><button class="primary" onclick="saveItem(\''+t+'\',\''+(x.id||'')+'\')">SAVE</button><button onclick="closeModal()">CANCEL</button></div>';$('modal').innerHTML='<h2>'+t.toUpperCase()+'</h2>'+fields;$('modal').classList.remove('hidden')}
async function saveItem(t,id){let v={enabled:$('f_enabled')?.checked!==false};if(t==='radio')Object.assign(v,{name:$('f_name').value,frequency:$('f_frequency').value,city:$('f_city').value,sort_order:+$('f_sort').value,stream_url:$('f_stream').value,website_url:$('f_web').value});if(t==='billboards')Object.assign(v,{zone:$('f_zone').value,headline:$('f_headline').value,subline:$('f_subline').value,image_url:$('f_image').value,sort_order:+$('f_sort').value});if(t==='missions')Object.assign(v,{mission_key:$('f_key').value,title:$('f_title').value,description:$('f_desc').value,reward_cash:+$('f_cash').value,reward_score:+$('f_score').value,sort_order:+$('f_sort').value});if(t==='config'){try{v={key:$('f_key').value,value:JSON.parse($('f_value').value)}}catch(e){return alert('Invalid JSON')}}let path='/api/admin/'+t+(id?'/'+id:'');await call(path,{method:id?'PATCH':'POST',body:JSON.stringify(v)});closeModal();load(t)}
async function delItem(t,id){if(!confirm('Delete this item?'))return;await call('/api/admin/'+t+'/'+id,{method:'DELETE'});load(t)}
function closeModal(){$('modal').classList.add('hidden')}
function editPlayer(id){let x=dash.players.find(p=>p.id===id);$('modal').innerHTML='<h2>EDIT PLAYER</h2><div class="row"><label>Name<input id="p_name" value="'+esc(x.display_name)+'"></label><label>Bank<input id="p_bank" type="number" value="'+x.bank+'"></label><label>Level<input id="p_level" type="number" value="'+x.level+'"></label><label>Engine<input id="p_engine" type="number" value="'+x.engine+'"></label><label>Tyres<input id="p_tyres" type="number" value="'+x.tyres+'"></label><label>Brakes<input id="p_brakes" type="number" value="'+x.brakes+'"></label><label>Body<input id="p_body" type="number" value="'+x.body+'"></label><label>Paint<input id="p_paint" value="'+esc(x.paint)+'"></label><label>Horn<input id="p_horn" value="'+esc(x.horn)+'"></label></div><button class="primary" onclick="savePlayer(\''+id+'\')">SAVE PLAYER</button> <button onclick="closeModal()">CANCEL</button>';$('modal').classList.remove('hidden')}
async function savePlayer(id){let v={id,display_name:$('p_name').value,bank:+$('p_bank').value,level:+$('p_level').value,engine:+$('p_engine').value,tyres:+$('p_tyres').value,brakes:+$('p_brakes').value,body:+$('p_body').value,paint:$('p_paint').value,horn:$('p_horn').value};await call('/api/admin/players',{method:'PATCH',body:JSON.stringify(v)});closeModal();load('playersView')}
async function playerRefresh(){load('playersView')}
$('signin').onclick=async()=>{try{let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)throw r.error;auth()}catch(e){$('msg').textContent=e.message}};$('signup').onclick=async()=>{try{let r=await sb.auth.signUp({email:$('email').value,password:$('password').value});if(r.error)throw r.error;$('msg').textContent='Check your email, then sign in. The first confirmed account can claim admin access.'}catch(e){$('msg').textContent=e.message}};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('tabs').onclick=e=>{let b=e.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.v)};async function auth(){let s=await sb.auth.getSession();if(s.data.session){$('auth').style.display='none';$('app').style.display='block';load()}}auth();</script></body></html>
